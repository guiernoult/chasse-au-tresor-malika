<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Chasse au trésor de Malika</title>
<style>
  body{
    font-family: Arial, sans-serif;
    text-align:center;
    margin:0;
    min-height:100vh;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    padding: 30px 15px;
    box-sizing: border-box;
  }
  .titre-principal{
    color:white;
    text-shadow: 0 2px 5px rgba(0,0,0,0.2);
  }
  .container{
    max-width:600px;
    margin: 0 auto;
  }
  .card{
    background:white;
    padding:20px 25px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
    margin-bottom:18px;
    text-align:left;
  }
  .card h2{
    margin-top:0;
    font-size:18px;
    color:#333;
  }
  .enigme-text{
    font-size:15px;
    line-height:1.5;
    color:#555;
  }
  .final-box{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    margin-top:20px;
  }
  input{
    padding:10px;
    font-size:18px;
    width:70%;
    margin-top:10px;
    border:2px solid #ee9ca7;
    border-radius:8px;
    text-align:center;
    letter-spacing: 2px;
  }
  button{
    padding:10px 20px;
    font-size:18px;
    margin-top:15px;
    cursor:pointer;
    border:none;
    border-radius:10px;
    background:#ff6b81;
    color:white;
  }
  button:hover{
    background:#ff4d6d;
  }
  #resultat{
    margin-top:15px;
    font-size:18px;
    font-weight:bold;
    min-height: 25px;
  }
</style>
</head>
<body>

<h1 class="titre-principal">🔎 Chasse au trésor de Malika ❤️</h1>

<div class="container">

  <div class="card">
    <h2>Énigme 🔑</h2>
    <p class="enigme-text">Difficile à ouvrir, je tiens en 3 lettres...</p>
  </div>

  <div class="final-box">
    <h2>Entre la réponse 🔐</h2>
    <input id="code" placeholder="Réponse en 3 lettres...">
    <br>
    <button onclick="verifierEnigme1()">Valider</button>
    <div id="resultat"></div>
  </div>

</div>

<script>
// Permet de valider avec la touche Entrée sur la première énigme
document.getElementById("code").addEventListener("keyup", function(event){
  if(event.key === "Enter"){ verifierEnigme1(); }
});

// Normalise les saisies de date (gère espaces, tirets et slashes)
function normaliserDate(str){
  return str.trim().replace(/\s+/g,"").replace(/-/g,"/");
}

// 1. Vérification Énigme PEA
function verifierEnigme1(){
  const val = document.getElementById("code").value.toLowerCase().trim();
  if(val === "pea"){
    afficherPhoto1();
  } else {
    document.getElementById("resultat").innerHTML = "❌ Essaie encore";
    document.getElementById("resultat").style.color = "red";
  }
}

// 2. Affichage Photo 1 : ABBA
function afficherPhoto1(){
  document.querySelector(".container").innerHTML = `
    <div class="final-box">
      <img src="abba.png" alt="photo souvenir ABBA" style="width:100%; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.2);">
      <h2 style="margin-top:20px;">Quelle est la date de cette photo ?</h2>
      <input id="date1" placeholder="jj/mm/aaaa">
      <br>
      <button onclick="verifierDate1()">Valider</button>
      <div id="resultatDate1"></div>
    </div>
  `;
  document.getElementById("date1").addEventListener("keyup", function(event){
    if(event.key === "Enter"){ verifierDate1(); }
  });
}

// Vérification Date ABBA (07/10/2023)
function verifierDate1(){
  const val = normaliserDate(document.getElementById("date1").value);
  if(val === "07/10/2023" || val === "7/10/2023"){
    afficherEncouragement1();
  } else {
    document.getElementById("resultatDate1").innerHTML = "❌ Essaie encore";
    document.getElementById("resultatDate1").style.color = "red";
  }
}

// Intermédiaire 1
function afficherEncouragement1(){
  document.querySelector(".container").innerHTML = `
    <div class="final-box">
      <div style="font-size:60px;">🌟</div>
      <h1>Bravo Malika !</h1>
      <p style="font-size:18px;">Bien joué ❤️</p>
      <button onclick="afficherPhoto2()">Continuer l'aventure ➜</button>
    </div>
  `;
}

// 3. Affichage Photo 2 : JMJ
function afficherPhoto2(){
  document.querySelector(".container").innerHTML = `
    <div class="final-box">
      <img src="jmj.png" alt="photo souvenir JMJ" style="width:100%; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.2);">
      <h2 style="margin-top:20px;">Quelle est la date de cette photo ?</h2>
      <input id="date2" placeholder="jj/mm/aaaa">
      <br>
      <button onclick="verifierDate2()">Valider</button>
      <div id="resultatDate2"></div>
    </div>
  `;
  document.getElementById("date2").addEventListener("keyup", function(event){
    if(event.key === "Enter"){ verifierDate2(); }
  });
}

// Vérification Date JMJ (06/08/2023)
function verifierDate2(){
  const val = normaliserDate(document.getElementById("date2").value);
  if(val === "06/08/2023" || val === "6/8/2023" || val === "06/8/2023" || val === "6/08/2023"){
    afficherFin();
  } else {
    document.getElementById("resultatDate2").innerHTML = "❌ Essaie encore";
    document.getElementById("resultatDate2").style.color = "red";
  }
}

// Écran de réussite final
function afficherFin(){
  document.querySelector(".container").innerHTML = `
    <div class="final-box">
      <div style="font-size:60px;">🎉</div>
      <h1>Félicitations Malika !</h1>
      <p style="font-size:18px;">Tu as résolu toutes les énigmes comme une cheffe ❤️. Tu peux ouvrir l'enveloppe C.C et C.C2 - A OUVRIR EN CACHETTE....</p>
    </div>
  `;
}
</script>
</body>
</html>
